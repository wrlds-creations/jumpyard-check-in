<!doctype html>
<html lang="sv">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobilens tillägg · Lokal förhandsvisning</title>
<style>
  *{box-sizing:border-box}body{margin:0;padding:16px;font:14px system-ui;background:white;color:#1c1c1e}main{display:grid;justify-items:center;gap:12px}h1{font-size:20px;margin:0}p{margin:0;max-width:620px;text-align:center}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}button,a{font:inherit;border:1px solid #e31837;border-radius:8px;background:white;color:#b9102b;padding:8px;cursor:pointer}iframe{display:block;width:390px;max-width:100%;height:844px;border:1px solid #f8c9d1;border-radius:16px}
</style>
<main>
<h1>Tillägg på mobilen</h1>
<p>Lokal förhandsvisning med testpriser. Inga riktiga köp eller betalningar.</p>
<nav aria-label="Skärmstorlek"><button data-width="390" data-height="844">Mobil 390 × 844</button><button data-width="320" data-height="568">Liten mobil 320 × 568</button></nav>
<p>Välj Köp entré eller sök DEMO318. DEMO318SOCKS har ett par strumpor. DEMO318PAID har också en tidigare köpt flaska.</p>
<a href="/" target="_blank">Öppna flödet i hela fönstret</a>
<iframe src="/" title="Mobilflöde"></iframe>
</main>
<script>
const frame=document.querySelector('iframe');
for(const button of document.querySelectorAll('button[data-width]'))button.addEventListener('click',()=>{
frame.style.width=button.dataset.width+'px';frame.style.height=button.dataset.height+'px';
});
</script>
</html>
